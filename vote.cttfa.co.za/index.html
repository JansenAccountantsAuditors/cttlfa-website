<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071A4A">
<title>CTTLFA Voting</title>
<style>
  :root{
    --navy:#071A4A; --navy2:#0C2560; --gold:#F4B41A; --gold-d:#B9860B;
    --ink:#0F1B33; --muted:#5B6577; --line:#E1E5EE; --bg:#F5F7FB; --card:#FFFFFF;
    --for:#1E7A46; --against:#B02A2A; --abstain:#5B6577;
    --for-bg:#E7F3EC; --against-bg:#FBEAEA; --abstain-bg:#EEF0F4;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-text-size-adjust:100%; min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column}
  header{background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px}
  header img{width:40px; height:40px; border-radius:8px; background:#fff; padding:2px; object-fit:contain; flex:0 0 auto}
  header .h-t{font-weight:700; font-size:16px; letter-spacing:.2px; line-height:1.15}
  header .h-s{font-size:11.5px; color:#C7D0E6; letter-spacing:.4px; text-transform:uppercase}
  main{flex:1; padding:18px; display:flex; flex-direction:column; gap:14px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px}
  .meta{display:flex; flex-wrap:wrap; gap:8px 14px; font-size:13px; color:var(--muted)}
  .meta b{color:var(--ink)}
  .pill{display:inline-block; background:var(--navy); color:#fff; font-size:12px; font-weight:700;
    padding:4px 10px; border-radius:999px}
  .pill.gold{background:var(--gold); color:#3A2A00}
  h1{font-size:20px; margin:2px 0 6px; line-height:1.25}
  h2{font-size:16px; margin:0 0 4px}
  p.instr{font-size:15px; color:#2A3550; margin:6px 0 0; white-space:pre-wrap}
  label.lab{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px}
  input#code{width:100%; font-size:30px; letter-spacing:10px; text-align:center; text-transform:uppercase;
    padding:16px 12px; border:2px solid var(--line); border-radius:12px; font-weight:700; color:var(--navy)}
  input#code:focus{outline:none; border-color:var(--gold)}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    font-size:18px; font-weight:700; padding:16px; border:0; border-radius:14px; cursor:pointer;
    min-height:56px; -webkit-tap-highlight-color:transparent}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--gold); color:#3A2A00}
  .btn-navy{background:var(--navy); color:#fff}
  .btn-ghost{background:#fff; color:var(--navy); border:2px solid var(--line); font-size:16px; min-height:48px}
  .choices{display:flex; flex-direction:column; gap:12px; margin-top:16px}
  .ch{font-size:20px; font-weight:800; letter-spacing:.3px; border:2px solid transparent}
  .ch-for{background:var(--for-bg); color:var(--for); border-color:#BCE0C9}
  .ch-against{background:var(--against-bg); color:var(--against); border-color:#EEC4C4}
  .ch-abstain{background:var(--abstain-bg); color:var(--abstain); border-color:#D8DCE4}
  .timer{height:10px; background:#E7EBF3; border-radius:999px; overflow:hidden; margin:14px 0 4px}
  .timer > i{display:block; height:100%; background:var(--gold); width:100%; transition:width 1s linear}
  .timer.low > i{background:var(--against)}
  .tcount{text-align:center; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .big-state{text-align:center; padding:22px 10px}
  .big-state .ic{width:76px; height:76px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:40px}
  .ic.ok{background:var(--for-bg); color:var(--for)}
  .ic.wait{background:#EAF0FB; color:var(--navy)}
  .ic.warn{background:var(--against-bg); color:var(--against)}
  .big-state h1{margin:0 0 4px}
  .big-state p{color:var(--muted); margin:0; font-size:15px}
  .result-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:16px}
  .result-row:last-child{border-bottom:0}
  .result-row b{font-variant-numeric:tabular-nums; font-size:18px}
  .rfor b{color:var(--for)} .ragainst b{color:var(--against)} .rabstain b{color:var(--abstain)}
  .outcome{text-align:center; font-size:22px; font-weight:800; padding:14px; border-radius:12px; margin-bottom:6px}
  .outcome.carried{background:var(--for-bg); color:var(--for)}
  .outcome.failed{background:var(--against-bg); color:var(--against)}
  .msg{font-size:13.5px; padding:11px 13px; border-radius:10px; margin-top:6px}
  .msg.err{background:var(--against-bg); color:#7d1d1d}
  .foot{padding:14px 18px 22px; text-align:center; font-size:11.5px; color:#9AA3B2}
  .hint{font-size:13px; color:var(--muted); margin-top:10px}
  .weightnote{font-size:14px; color:var(--ink); background:#FBF3DA; border:1px solid #F0DFA6; padding:10px 12px; border-radius:10px; margin-top:12px}
  @media (prefers-reduced-motion: reduce){ .timer > i{transition:none} .btn:active{transform:none} }
</style>
</head>

<script>
"use strict";
var SB="https://fbbbsvkshajollduapaw.supabase.co/rest/v1/rpc/";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiYmJzdmtzaGFqb2xsZHVhcGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwODYyODgsImV4cCI6MjEwMzY2MjI4OH0.8heeqe-03Mji2NgHt17ZOCoctijRhF78cHvSQkrUUi0";
var M=document.getElementById("main");
var code=null, dev=null, poll=null, state=null, pending=null, busy=false, tick=null;

function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function device(){ var d=load("cttlfa_dev"); if(!d){ d=(Date.now().toString(36)+Math.random().toString(36).slice(2,12)); store("cttlfa_dev",d);} return d; }

function rpc(fn,args){
  return fetch(SB+fn,{method:"POST",headers:{apikey:KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args)})
    .then(function(r){ return r.json(); })
    .catch(function(){ return {ok:false,error:"network"}; });
}

function startPoll(){ stopPoll(); poll=setInterval(refresh, 4000); }
function stopPoll(){ if(poll){ clearInterval(poll); poll=null; } }

function refresh(){
  if(busy||!code) return Promise.resolve();
  return rpc("voter_state",{p_code:code,p_device:dev}).then(function(s){
    if(s && s.ok===false && (s.error==="invalid_code"||s.error==="other_device"||s.error==="no_code")){
      stopPoll(); state=s; render(); return;
    }
    if(s && s.ok){ state=s; if(!pending) render(); }
  });
}

function fmt(sec){ sec=Math.max(0,Math.floor(sec)); var m=Math.floor(sec/60), s=sec%60; return m+":"+(s<10?"0":"")+s; }

/* ---------- screens ---------- */
function screenEntry(err){
  pending=null;
  M.innerHTML='<div class="card">'+
    '<h1>Enter your voting code</h1>'+
    '<p class="hint">Use the 6-character code on your accreditation slip, or scan the QR code you were given.</p>'+
    '<div style="margin:16px 0 6px"><label class="lab" for="code">Voting code</label>'+
    '<input id="code" maxlength="6" autocomplete="one-time-code" autocapitalize="characters" inputmode="text" placeholder="------"></div>'+
    (err?'<div class="msg err">'+esc(err)+'</div>':'')+
    '<div style="margin-top:14px"><button class="btn btn-primary" id="go">Continue</button></div>'+
    '</div>';
  var inp=document.getElementById("code");
  inp.addEventListener("input",function(){ this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,""); });
  document.getElementById("go").onclick=submitCode;
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter") submitCode(); });
  setTimeout(function(){ try{inp.focus();}catch(e){} },100);
}
function submitCode(){
  var v=(document.getElementById("code").value||"").trim().toUpperCase();
  if(v.length<6){ screenEntry("Please enter all 6 characters."); return; }
  code=v; store("cttlfa_code",v); connect();
}

function connect(){
  M.innerHTML='<div class="card big-state"><div class="ic wait">•••</div><h1>Checking your code…</h1></div>';
  refresh().then(function(){ startPoll(); });
}

function errText(e){
  if(e==="invalid_code") return "That code was not recognised. Check it, or ask the accreditation desk for a new one.";
  if(e==="other_device") return "This code is already active on another phone. If that was not you, ask the accreditation desk to issue a new code.";
  return "Something went wrong. Please try again.";
}

function render(){
  if(!state){ screenEntry(); return; }
  if(state.ok===false){
    M.innerHTML='<div class="card big-state"><div class="ic warn">!</div><h1>Code problem</h1>'+
      '<p>'+esc(errText(state.error))+'</p></div>'+
      '<div class="card"><button class="btn btn-ghost" id="reenter">Enter a different code</button></div>';
    document.getElementById("reenter").onclick=function(){ code=null; store("cttlfa_code",null); state=null; screenEntry(); };
    return;
  }
  var head='<div class="card"><div class="meta">'+
      '<span><b>'+esc(state.club)+'</b></span>'+
      '<span>'+esc((state.kind||"").toUpperCase())+'</span>'+
      '<span class="pill gold">'+state.weight+' vote'+(state.weight>1?'s':'')+'</span>'+
    '</div></div>';
  var m=state.motion;
  if(!m){
    M.innerHTML=head+'<div class="card big-state"><div class="ic wait">⏳</div>'+
      '<h1>You are checked in</h1><p>Waiting for the chairperson to open the next vote. This screen will update on its own.</p></div>';
    return;
  }
  if(m.status==="closed"){ renderClosed(head,m); return; }
  if(m.my_choice){ renderVoted(head,m); return; }
  if(!m.eligible){
    M.innerHTML=head+'<div class="card"><h1>'+esc(m.title)+'</h1>'+
      (m.instruction?'<p class="instr">'+esc(m.instruction)+'</p>':'')+
      '<div class="msg err" style="margin-top:14px">Your club is an associate member and is not eligible to vote on this motion.</div></div>';
    return;
  }
  if(pending){ renderConfirm(head,m); return; }
  renderBallot(head,m);
}

function timerHTML(m){
  if(!m.opened_at||!m.timer_seconds) return "";
  return '<div class="timer" id="tbar"><i id="tfill"></i></div><div class="tcount" id="tcount"></div>';
}
function runTimer(m){
  if(tick){ clearInterval(tick); tick=null; }
  var fill=document.getElementById("tfill"), cnt=document.getElementById("tcount"), bar=document.getElementById("tbar");
  if(!fill||!m.opened_at||!m.timer_seconds) return;
  var start=new Date(m.opened_at).getTime(), total=m.timer_seconds*1000;
  function up(){
    var rem=Math.max(0,(start+total)-Date.now());
    var pct=Math.max(0,Math.min(100, rem/total*100));
    fill.style.width=pct+"%";
    if(bar){ bar.classList.toggle("low", rem<=10000); }
    if(cnt){ cnt.textContent = rem>0 ? ("Time remaining "+fmt(rem/1000)) : "Time is up. Waiting for the chair to close the vote."; }
    if(rem<=0 && tick){ clearInterval(tick); tick=null; }
  }
  up(); tick=setInterval(up,1000);
}

function renderBallot(head,m){
  M.innerHTML=head+'<div class="card">'+
    '<span class="pill">Motion '+ (m.seq||"") +' · voting open</span>'+
    '<h1 style="margin-top:10px">'+esc(m.title)+'</h1>'+
    (m.instruction?'<p class="instr">'+esc(m.instruction)+'</p>':'')+
    timerHTML(m)+
    '<div class="weightnote">Your vote will be recorded as your full '+state.weight+' vote'+(state.weight>1?'s':'')+', all one way.</div>'+
    '<div class="choices">'+
      '<button class="btn ch ch-for" data-c="yes">For</button>'+
      '<button class="btn ch ch-against" data-c="no">Against</button>'+
      '<button class="btn ch ch-abstain" data-c="abstain">Abstain</button>'+
    '</div></div>';
  Array.prototype.forEach.call(M.querySelectorAll("[data-c]"),function(b){
    b.onclick=function(){ pending=b.getAttribute("data-c"); render(); };
  });
  runTimer(m);
}

function choiceLabel(c){ return c==="yes"?"For":(c==="no"?"Against":"Abstain"); }
function choiceClass(c){ return c==="yes"?"ch-for":(c==="no"?"ch-against":"ch-abstain"); }

function renderConfirm(head,m){
  M.innerHTML=head+'<div class="card">'+
    '<h1>Confirm your vote</h1>'+
    '<p class="hint">This cannot be changed once confirmed.</p>'+
    '<div class="btn ch '+choiceClass(pending)+'" style="margin:16px 0; cursor:default">'+choiceLabel(pending)+'</div>'+
    '<div class="weightnote">Recorded as '+state.weight+' vote'+(state.weight>1?'s':'')+' '+esc(choiceLabel(pending))+'.</div>'+
    '<div class="choices">'+
      '<button class="btn btn-navy" id="confirm">Confirm '+esc(choiceLabel(pending))+'</button>'+
      '<button class="btn btn-ghost" id="back">Back</button>'+
    '</div>'+
    '<div id="cmsg"></div></div>';
  document.getElementById("back").onclick=function(){ pending=null; render(); };
  document.getElementById("confirm").onclick=function(){ castVote(m); };
}

function castVote(m){
  if(busy) return; busy=true;
  var btn=document.getElementById("confirm"); if(btn){ btn.disabled=true; btn.textContent="Recording…"; }
  var choice=pending;
  rpc("cast_vote",{p_code:code,p_motion:m.id,p_choice:choice,p_device:dev}).then(function(res){
    busy=false;
    if(res && res.ok){ pending=null; if(state&&state.motion){ state.motion.my_choice=choice; } render(); refresh(); return; }
    var e=res?res.error:"network";
    var t = e==="already_voted"?"You have already voted on this motion."
          : e==="not_open"?"Voting has closed for this motion."
          : e==="not_eligible"?"Your club is not eligible to vote on this motion."
          : e==="other_device"?"This code is active on another phone."
          : "Could not record your vote. Please try again.";
    var mm=document.getElementById("cmsg"); if(mm){ mm.innerHTML='<div class="msg err">'+esc(t)+'</div>'; }
    if(btn){ btn.disabled=false; btn.textContent="Confirm "+choiceLabel(choice); }
    if(e==="already_voted"||e==="not_open"){ pending=null; refresh().then(render); }
  });
}

function renderVoted(head,m){
  if(tick){ clearInterval(tick); tick=null; }
  M.innerHTML=head+'<div class="card big-state">'+
    '<div class="ic ok">✓</div>'+
    '<h1>Your vote is recorded</h1>'+
    '<p>You voted <b>'+esc(choiceLabel(m.my_choice))+'</b> on this motion.</p>'+
    '<div class="weightnote" style="text-align:left; margin-top:16px">Motion '+(m.seq||"")+': '+esc(m.title)+'. Waiting for the chairperson to close the vote and read the result.</div>'+
    '</div>';
}

function renderClosed(head,m){
  if(tick){ clearInterval(tick); tick=null; }
  var t=m.tally||{yes_w:0,no_w:0,abstain_w:0};
  var carried=!!t.passed;
  var html=head+'<div class="card">'+
    '<span class="pill">Motion '+(m.seq||"")+' · closed</span>'+
    '<h2 style="margin-top:10px">'+esc(m.title)+'</h2>'+
    '<div class="outcome '+(carried?"carried":"failed")+'" style="margin-top:12px">'+(carried?"Motion carried":"Motion not carried")+'</div>'+
    '<div class="result-row rfor"><span>For</span><b>'+(t.yes_w||0)+'</b></div>'+
    '<div class="result-row ragainst"><span>Against</span><b>'+(t.no_w||0)+'</b></div>'+
    '<div class="result-row rabstain"><span>Abstain</span><b>'+(t.abstain_w||0)+'</b></div>';
  if(m.my_choice){ html+='<p class="hint">You voted '+esc(choiceLabel(m.my_choice))+'.</p>'; }
  html+='<p class="hint">'+esc(ruleText(t))+'</p></div>';
  M.innerHTML=html;
}
function ruleText(t){
  var r=t.rule==="two_thirds"?"Two-thirds majority": (t.rule==="custom"? (t.threshold_pct+"% required") : "Simple majority");
  var ab=t.abstain_mode==="in_base"?"abstentions counted in the base":"abstentions set aside";
  return r+", "+ab+".";
}

/* ---------- boot ---------- */
(function(){
  dev=device();
  var qs=new URLSearchParams(location.search);
  var c=(qs.get("c")||qs.get("code")||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!c) c=(load("cttlfa_code")||"");
  if(c && c.length>=6){ code=c; store("cttlfa_code",c);
    if(location.search){ try{ history.replaceState(null,"",location.pathname); }catch(e){} }
    connect();
  } else {
    screenEntry();
  }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden && code){ refresh(); } });
})();
</script>
</body>

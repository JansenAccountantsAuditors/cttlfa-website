<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071A4A">
<title>CTTLFA Voting — Practice</title>
<style>
  :root{
    --navy:#071A4A; --navy2:#0C2560; --gold:#F4B41A; --gold-d:#B9860B;
    --ink:#0F1B33; --muted:#5B6577; --line:#E1E5EE; --bg:#F5F7FB; --card:#FFFFFF;
    --for:#1E7A46; --against:#B02A2A; --abstain:#5B6577;
    --for-bg:#E7F3EC; --against-bg:#FBEAEA; --abstain-bg:#EEF0F4;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-text-size-adjust:100%; min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column}
  header{background:var(--navy); color:#fff; padding:18px 18px 14px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px}
  header img{width:56px; height:56px; border-radius:12px; background:#fff; padding:3px; object-fit:contain; flex:0 0 auto}
  header .h-t{font-weight:800; font-size:20px; letter-spacing:.4px; line-height:1.1}
  header .h-s{font-size:11px; color:#C7D0E6; letter-spacing:1.4px; text-transform:uppercase; margin-top:1px}
  .clock{background:var(--navy2); color:#C7D0E6; text-align:center; font-size:12.5px; padding:8px 12px; letter-spacing:.2px; border-bottom:1px solid rgba(255,255,255,.06)}
  .clock b{color:#fff; font-weight:600}
  .demobar{background:var(--gold); color:#3A2A00; text-align:center; font-size:12.5px; font-weight:700; padding:7px 12px; letter-spacing:.3px}
  .mtg-name{font-weight:800; font-size:16.5px; color:var(--ink); margin:0 0 8px; line-height:1.25}
  main{flex:1; padding:18px; display:flex; flex-direction:column; gap:14px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px}
  .meta{display:flex; flex-wrap:wrap; gap:8px 14px; font-size:13px; color:var(--muted)}
  .meta b{color:var(--ink)}
  .pill{display:inline-block; background:var(--navy); color:#fff; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px}
  .pill.gold{background:var(--gold); color:#3A2A00}
  h1{font-size:20px; margin:2px 0 6px; line-height:1.25}
  h2{font-size:16px; margin:0 0 4px}
  p.instr{font-size:15px; color:#2A3550; margin:6px 0 0; white-space:pre-wrap}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    font-size:18px; font-weight:700; padding:16px; border:0; border-radius:14px; cursor:pointer;
    min-height:56px; -webkit-tap-highlight-color:transparent}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--gold); color:#3A2A00}
  .btn-navy{background:var(--navy); color:#fff}
  .btn-ghost{background:#fff; color:var(--navy); border:2px solid var(--line); font-size:16px; min-height:48px}
  .choices{display:flex; flex-direction:column; gap:12px; margin-top:16px}
  .ch{font-size:20px; font-weight:800; letter-spacing:.3px; border:2px solid transparent}
  .ch-for{background:var(--for-bg); color:var(--for); border-color:#BCE0C9}
  .ch-against{background:var(--against-bg); color:var(--against); border-color:#EEC4C4}
  .ch-abstain{background:var(--abstain-bg); color:var(--abstain); border-color:#D8DCE4}
  .timer{height:10px; background:#E7EBF3; border-radius:999px; overflow:hidden; margin:14px 0 4px}
  .timer > i{display:block; height:100%; background:var(--gold); width:100%; transition:width 1s linear}
  .timer.low > i{background:var(--against)}
  .tcount{text-align:center; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .big-state{text-align:center; padding:22px 10px}
  .big-state .ic{width:76px; height:76px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:40px}
  .ic.ok{background:var(--for-bg); color:var(--for)}
  .ic.wait{background:#EAF0FB; color:var(--navy)}
  .big-state h1{margin:0 0 4px}
  .big-state p{color:var(--muted); margin:0; font-size:15px}
  .result-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:16px}
  .result-row:last-child{border-bottom:0}
  .result-row b{font-variant-numeric:tabular-nums; font-size:18px}
  .rfor b{color:var(--for)} .ragainst b{color:var(--against)} .rabstain b{color:var(--abstain)}
  .outcome{text-align:center; font-size:22px; font-weight:800; padding:14px; border-radius:12px; margin-bottom:6px}
  .outcome.carried{background:var(--for-bg); color:var(--for)}
  .outcome.failed{background:var(--against-bg); color:var(--against)}
  .foot{padding:14px 18px 22px; text-align:center; font-size:11.5px; color:#9AA3B2}
  .hint{font-size:13px; color:var(--muted); margin-top:10px}
  .weightnote{font-size:14px; color:var(--ink); background:#FBF3DA; border:1px solid #F0DFA6; padding:10px 12px; border-radius:10px; margin-top:12px}
  .steps{margin:14px 0 4px; padding-left:22px; font-size:14.5px; line-height:1.6}
  .steps li{margin-bottom:9px}
  .prog{display:flex; gap:6px; justify-content:center; margin-top:4px}
  .prog i{width:9px; height:9px; border-radius:50%; background:#D5DBE6}
  .prog i.on{background:var(--gold)} .prog i.done{background:var(--for)}
  @media (prefers-reduced-motion: reduce){ .timer > i{transition:none} .btn:active{transform:none} }
</style>
</head>
<body>

<script>
"use strict";
var M=document.getElementById("main"), tick=null;
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONF=["January","February","March","April","May","June","July","August","September","October","November","December"];
function two(n){return (n<10?"0":"")+n;}
function updateClock(){var el=document.getElementById("clock");if(!el)return;var d=new Date();
  el.innerHTML=DAYS[d.getDay()]+", "+d.getDate()+" "+MONF[d.getMonth()]+" "+d.getFullYear()+" &middot; <b>"+two(d.getHours())+":"+two(d.getMinutes())+"</b>";}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(sec){sec=Math.max(0,Math.floor(sec));var m=Math.floor(sec/60),s=sec%60;return m+":"+(s<10?"0":"")+s;}

/* ---- demo data: a delegate and four motions, like a real AGM ---- */
var DEL={meeting:"CTTLFA General Meeting", date:"15 Sep 2025", venue:"Parow Civic Centre", club:"Tableview FC", weight:2};
var MOTIONS=[
  {seq:1,title:"Adoption of the 2026 budget",instr:"Vote Yes to adopt the 2026 budget as presented by the Treasurer.\nVote No to reject it.",rule:"Simple majority",tally:{yes:34,no:8,ab:3}},
  {seq:2,title:"Constitutional amendment: Article 6 (quorum)",instr:"This changes the Constitution, so it needs a two-thirds majority to pass.\nVote Yes to adopt the amended quorum rule, No to keep the current one.",rule:"Two-thirds majority",tally:{yes:31,no:12,ab:2}},
  {seq:3,title:"Approval of the audited 2025 financial statements",instr:"Vote Yes to approve the 2025 audited financial statements, No to reject them.",rule:"Simple majority",tally:{yes:40,no:3,ab:2}},
  {seq:4,title:"Election of the Vice-Chairperson",instr:"Vote Yes to elect the nominated candidate as Vice-Chairperson, No to reject the nomination.",rule:"Simple majority",tally:{yes:22,no:20,ab:3}}
];
var idx=0, choice=null, myChoice=null;

function progressHTML(){
  var h='<div class="prog">';
  for(var i=0;i<MOTIONS.length;i++){ var c=i<idx?"done":(i===idx?"on":""); h+='<i class="'+c+'"></i>'; }
  return h+'</div>';
}
function headHTML(){
  return '<div class="card"><div class="mtg-name">'+esc(DEL.meeting)+'</div><div class="meta">'+
    '<span>'+esc(DEL.date)+' &middot; '+esc(DEL.venue)+'</span>'+
    '<span><b>'+esc(DEL.club)+'</b></span>'+
    '<span class="pill gold">'+DEL.weight+' votes</span></div></div>';
}

function screenIntro(){
  if(tick){clearInterval(tick);tick=null;}
  M.innerHTML='<div class="card">'+
    '<span class="pill gold">Practice run</span>'+
    '<h1 style="margin-top:10px">Try voting, step by step</h1>'+
    '<p class="hint">This is a safe practice. It works exactly like the real thing, but nothing is recorded. There are four things to vote on, just like a real meeting.</p>'+
    '<ol class="steps">'+
      '<li>You are already signed in as a delegate for <b>'+esc(DEL.club)+'</b>. On the day you get here by tapping the link in your SMS, so there is nothing to type.</li>'+
      '<li>When the chairperson opens a vote, three big buttons appear: <b style="color:var(--for)">Yes</b>, <b style="color:var(--against)">No</b>, <b style="color:var(--abstain)">Abstain</b>.</li>'+
      '<li>Tap one, then tap confirm. That is it.</li>'+
    '</ol>'+
    '<div class="choices"><button class="btn btn-primary" id="start">Start the practice</button></div>'+
    '</div>'+headHTML();
  document.getElementById("start").onclick=function(){ idx=0; openWaiting(); };
}

function openWaiting(){
  choice=null; myChoice=null;
  M.innerHTML=headHTML()+'<div class="card big-state"><div class="ic wait">⏳</div>'+
    '<h1>You are checked in</h1><p>The chairperson is about to open vote '+(idx+1)+' of '+MOTIONS.length+'. This screen changes on its own.</p>'+
    progressHTML()+'</div>';
  setTimeout(function(){ screenBallot(); }, 1400);
}

function screenBallot(){
  var m=MOTIONS[idx]; choice=null;
  M.innerHTML=headHTML()+'<div class="card">'+
    '<span class="pill">Motion '+m.seq+' of '+MOTIONS.length+' &middot; voting open</span>'+
    '<h1 style="margin-top:10px">'+esc(m.title)+'</h1>'+
    '<p class="instr">'+esc(m.instr)+'</p>'+
    '<div class="timer" id="tbar"><i id="tfill"></i></div><div class="tcount" id="tcount"></div>'+
    '<div class="weightnote">Your vote will be recorded as your full '+DEL.weight+' votes, all one way.</div>'+
    '<div class="choices">'+
      '<button class="btn ch ch-for" data-c="yes">Yes</button>'+
      '<button class="btn ch ch-against" data-c="no">No</button>'+
      '<button class="btn ch ch-abstain" data-c="abstain">Abstain</button>'+
    '</div></div>'+progressCard();
  Array.prototype.forEach.call(M.querySelectorAll("[data-c]"),function(b){ b.onclick=function(){ choice=b.getAttribute("data-c"); screenConfirm(); }; });
  runTimer(30);
}
function progressCard(){ return '<div class="card" style="padding:14px 18px">'+progressHTML()+'</div>'; }

function runTimer(secs){
  if(tick){clearInterval(tick);tick=null;}
  var fill=document.getElementById("tfill"), cnt=document.getElementById("tcount"), bar=document.getElementById("tbar");
  var end=Date.now()+secs*1000, total=secs*1000;
  function up(){
    var rem=Math.max(0,end-Date.now()), pct=Math.max(0,Math.min(100,rem/total*100));
    if(fill) fill.style.width=pct+"%";
    if(bar) bar.classList.toggle("low",rem<=10000);
    if(cnt) cnt.textContent = rem>0 ? ("Time remaining "+fmt(rem/1000)) : "Time is up.";
    if(rem<=0 && tick){ clearInterval(tick); tick=null; }
  }
  up(); tick=setInterval(up,1000);
}
function labelOf(c){ return c==="yes"?"Yes":(c==="no"?"No":"Abstain"); }
function classOf(c){ return c==="yes"?"ch-for":(c==="no"?"ch-against":"ch-abstain"); }

function screenConfirm(){
  if(tick){clearInterval(tick);tick=null;}
  var m=MOTIONS[idx];
  M.innerHTML=headHTML()+'<div class="card">'+
    '<h1>Confirm your vote</h1>'+
    '<p class="hint">On the day this cannot be changed once confirmed.</p>'+
    '<div class="btn ch '+classOf(choice)+'" style="margin:16px 0;cursor:default">'+labelOf(choice)+'</div>'+
    '<div class="weightnote">Recorded as '+DEL.weight+' votes '+esc(labelOf(choice))+'.</div>'+
    '<div class="choices">'+
      '<button class="btn btn-navy" id="confirm">Confirm '+esc(labelOf(choice))+'</button>'+
      '<button class="btn btn-ghost" id="back">Back</button>'+
    '</div></div>';
  document.getElementById("back").onclick=screenBallot;
  document.getElementById("confirm").onclick=function(){ myChoice=choice; screenRecorded(); };
}

function screenRecorded(){
  var m=MOTIONS[idx];
  M.innerHTML=headHTML()+'<div class="card big-state"><div class="ic ok">✓</div>'+
    '<h1>Your vote is recorded</h1><p>You voted <b>'+esc(labelOf(myChoice))+'</b>.</p>'+
    '<div class="weightnote" style="text-align:left;margin-top:16px">Motion '+m.seq+': '+esc(m.title)+'. On the day you now wait for the chairperson to close the vote and read the result.</div>'+
    '<div class="choices"><button class="btn btn-primary" id="see">See the result</button></div>'+
    progressHTML()+'</div>';
  document.getElementById("see").onclick=screenResult;
}

function screenResult(){
  var m=MOTIONS[idx], t=m.tally;
  var carried = m.rule==="Two-thirds majority" ? (t.yes >= (t.yes+t.no)*2/3 - 1e-9) : (t.yes>t.no);
  var more = idx < MOTIONS.length-1;
  M.innerHTML=headHTML()+'<div class="card">'+
    '<span class="pill">Motion '+m.seq+' &middot; closed</span>'+
    '<h2 style="margin-top:10px">'+esc(m.title)+'</h2>'+
    '<div class="outcome '+(carried?"carried":"failed")+'" style="margin-top:12px">'+(carried?"Motion carried":"Motion not carried")+'</div>'+
    '<div class="result-row rfor"><span>Yes</span><b>'+t.yes+'</b></div>'+
    '<div class="result-row ragainst"><span>No</span><b>'+t.no+'</b></div>'+
    '<div class="result-row rabstain"><span>Abstain</span><b>'+t.ab+'</b></div>'+
    (myChoice?'<p class="hint">You voted '+esc(labelOf(myChoice))+'.</p>':'')+
    '<p class="hint">'+esc(m.rule)+'. These are sample numbers for the practice.</p>'+
    '<div class="choices">'+
      (more?'<button class="btn btn-primary" id="next">Next vote ('+(idx+2)+' of '+MOTIONS.length+')</button>'
           :'<button class="btn btn-primary" id="again">Start the practice again</button>')+
    '</div></div>'+progressCard();
  if(more){ document.getElementById("next").onclick=function(){ idx++; openWaiting(); }; }
  else { document.getElementById("again").onclick=function(){ idx=0; screenIntro(); }; }
}

updateClock(); setInterval(updateClock,15000);
screenIntro();
</script>
</body>
</html>

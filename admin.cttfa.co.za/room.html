<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTTLFA Room View</title>
<style>
  :root{--navy:#071A4A;--navy2:#0C2560;--gold:#F4B41A;--for:#3FBB6B;--against:#F06565;--muted:#9fb0d8;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 700px at 50% -10%,#0d2b6b,var(--navy));color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:16px;padding:22px 40px;border-bottom:1px solid rgba(255,255,255,.08)}
  header img{width:56px;height:56px;border-radius:12px;background:#fff;padding:4px;object-fit:contain}
  header .m{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  header .mn{font-size:22px;font-weight:800}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 5vw}
  .status{display:inline-flex;align-items:center;gap:12px;font-size:20px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-bottom:18px}
  .dot{width:16px;height:16px;border-radius:50%}
  .dot.on{background:var(--for);box-shadow:0 0 22px var(--for)} .dot.off{background:var(--against)}
  .seq{font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:6px}
  h1{font-size:clamp(34px,6vw,76px);line-height:1.05;margin:0 0 14px;font-weight:800;max-width:22ch}
  .instr{font-size:clamp(18px,2.4vw,30px);color:#d6def3;max-width:40ch;margin:0 auto 26px;line-height:1.4}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(90px,22vw,260px);line-height:1;letter-spacing:.02em}
  .timer.low{color:var(--against)}
  .sub{color:var(--muted);font-size:22px;margin-top:10px;letter-spacing:.03em}
  .outcome{font-size:clamp(40px,8vw,110px);font-weight:800;margin:6px 0 26px}
  .outcome.carried{color:var(--for)} .outcome.failed{color:var(--against)}
  .tally{display:flex;gap:34px;flex-wrap:wrap;justify-content:center}
  .tcell{min-width:180px}
  .tcell .n{font-size:clamp(48px,9vw,120px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .tcell .l{font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .tfor .n{color:var(--for)} .tagainst .n{color:var(--against)} .tabs .n{color:var(--gold)}
  footer{padding:16px 40px;color:var(--muted);font-size:14px;text-align:center;border-top:1px solid rgba(255,255,255,.08)}
  .big-wait{font-size:clamp(30px,4vw,52px);font-weight:800;color:#cdd7f0}
  .rcontrols{margin-left:auto;display:flex;gap:10px}
  .rbtn{appearance:none;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.10);color:#fff;
    font:inherit;font-size:14px;font-weight:700;letter-spacing:.02em;padding:9px 15px;border-radius:9px;cursor:pointer;
    min-height:40px;transition:background .15s,border-color .15s}
  .rbtn:hover{background:rgba(255,255,255,.18)}
  .rbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .rbtn.close{background:rgba(240,101,101,.16);border-color:rgba(240,101,101,.5)}
  .rbtn.close:hover{background:rgba(240,101,101,.28)}
  body.fs header .rcontrols .rbtn{opacity:.5}
  body.fs header .rcontrols .rbtn:hover{opacity:1}
</style>
</head>
<body>

    <div><div class="m" id="kind">General Meeting</div><div class="mn" id="mname">CTTLFA</div></div>
    <div class="rcontrols">
      <button class="rbtn" id="fsBtn" title="Fill the whole screen for the hall projector. Press Esc or this button again to exit.">Full screen</button>
      <button class="rbtn close" id="closeBtn" title="Close this projector tab and go back to the admin.">Close</button>
    </div>
  </header>
  <main id="main"><div class="big-wait">Connecting…</div></main>
  <footer>CTTLFA delegate voting · secret ballot · results shown on close</footer>
<script>
"use strict";
var SB="https://fbbbsvkshajollduapaw.supabase.co/rest/v1/rpc/room_state";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiYmJzdmtzaGFqb2xsZHVhcGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwODYyODgsImV4cCI6MjEwMzY2MjI4OH0.8heeqe-03Mji2NgHt17ZOCoctijRhF78cHvSQkrUUi0";
var M=document.getElementById("main"), qs=new URLSearchParams(location.search), MID=qs.get("m")||"";
var tick=null;
function fmt(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x;}
function poll(){
  if(!MID){ M.innerHTML='<div class="big-wait">No meeting selected.<br><span style="font-size:20px;color:#9fb0d8">Open this from the Live tab in the admin.</span></div>'; return; }
  fetch(SB,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_meeting:MID})})
    .then(function(r){return r.json();}).then(render).catch(function(){});
}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function render(s){
  if(!s||s.ok===false){ M.innerHTML='<div class="big-wait">Waiting for the meeting…</div>'; return; }
  document.getElementById("mname").textContent=s.meeting||"CTTLFA";
  document.getElementById("kind").textContent=(s.kind||"").toString().toUpperCase();
  var m=s.motion;
  if(!m){ if(tick){clearInterval(tick);tick=null;} M.innerHTML='<div class="big-wait">Waiting for the chairperson to open the next vote.</div>'; return; }
  if(m.status==="open"){
    M.innerHTML='<div class="status"><span class="dot on"></span>Voting open</div>'+
      '<div class="seq">Motion '+(m.seq||"")+'</div><h1>'+esc(m.title)+'</h1>'+
      (m.instruction?'<div class="instr">'+esc(m.instruction)+'</div>':'')+
      '<div class="timer" id="tmr">--</div>'+
      '<div class="sub">'+(m.strength||0)+' votes accredited</div>';
    runTimer(m);
  } else {
    if(tick){clearInterval(tick);tick=null;}
    var t=m.tally||{}, carried=!!t.passed;
    M.innerHTML='<div class="seq">Motion '+(m.seq||"")+' · closed</div><h1 style="font-size:clamp(28px,4vw,52px)">'+esc(m.title)+'</h1>'+
      '<div class="outcome '+(carried?"carried":"failed")+'">'+(carried?"CARRIED":"NOT CARRIED")+'</div>'+
      '<div class="tally"><div class="tcell tfor"><div class="n">'+(t.yes_w||0)+'</div><div class="l">Yes</div></div>'+
      '<div class="tcell tagainst"><div class="n">'+(t.no_w||0)+'</div><div class="l">No</div></div>'+
      '<div class="tcell tabs"><div class="n">'+(t.abstain_w||0)+'</div><div class="l">Abstain</div></div></div>';
  }
}
function runTimer(m){
  if(tick){clearInterval(tick);tick=null;}
  var el=document.getElementById("tmr"); if(!el||!m.opened_at||!m.timer_seconds){ if(el) el.textContent="--"; return; }
  var start=new Date(m.opened_at).getTime(), total=m.timer_seconds*1000;
  function up(){ var rem=Math.max(0,(start+total)-Date.now()); el.textContent=fmt(rem/1000); el.classList.toggle("low",rem<=10000); if(rem<=0&&tick){clearInterval(tick);tick=null;} }
  up(); tick=setInterval(up,250);
}
// Projector controls: full screen + close
(function(){
  var fsBtn=document.getElementById("fsBtn"), closeBtn=document.getElementById("closeBtn");
  function inFs(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  function syncFs(){
    var on=!!inFs();
    document.body.classList.toggle("fs",on);
    if(fsBtn) fsBtn.textContent=on?"Exit full screen":"Full screen";
  }
  if(fsBtn){
    fsBtn.addEventListener("click",function(){
      try{
        if(inFs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
        else{ var el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
      }catch(e){}
    });
    document.addEventListener("fullscreenchange",syncFs);
    document.addEventListener("webkitfullscreenchange",syncFs);
  }
  if(closeBtn){
    closeBtn.addEventListener("click",function(){
      try{ window.close(); }catch(e){}
      // Browsers block window.close() on tabs the script did not open, so fall back to a plain exit screen.
      setTimeout(function(){
        if(tick){clearInterval(tick);tick=null;}
        document.body.innerHTML='<main style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 5vw">'+
          '<div class="big-wait">Projector view closed.<br><span style="font-size:20px;color:#9fb0d8">You can close this browser tab, or reopen the room from the Live tab in the admin.</span></div></main>';
      },120);
    });
  }
})();
poll(); setInterval(poll,3000);
</script>
</body>
</html>

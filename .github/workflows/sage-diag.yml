name: Sage NOR002 diagnostic

# One-off read-only diagnostic: dumps Norway Parks (NOR002) documents from the
# Sage API to the run log, to pin the R500 reconciliation gap. Writes nothing.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Customer code to diagnose"
        required: false
        default: "NOR002"

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SAGE_API_KEY: ${{ secrets.SAGE_API_KEY }}
      SAGE_USER: ${{ secrets.SAGE_USER }}
      SAGE_PASS: ${{ secrets.SAGE_PASS }}
      SAGE_COMPANY_ID: "364261"
      DIAG_CODE: ${{ github.event.inputs.code }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install httpx
      - name: Run diagnostic
        run: python diag_nor002_api.py

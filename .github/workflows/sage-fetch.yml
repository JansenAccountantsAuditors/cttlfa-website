name: Sage debtors fetch

# Pulls CTTLFA club balances, ageing and the itemised ledger from the Sage
# Accounting API and loads them into the admin dashboard (Supabase), replacing
# the office-PC fetch agent. Runs nightly and on demand (the "Fetch from Sage"
# button dispatches this workflow via the sage-refresh edge function).
# Credentials come from repository secrets; no secret value is stored here.

on:
  schedule:
    - cron: "20 1 * * *"      # 01:20 UTC = 03:20 SAST, nightly
  workflow_dispatch: {}

concurrency:
  group: sage-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SAGE_API_KEY: ${{ secrets.SAGE_API_KEY }}
      SAGE_USER: ${{ secrets.SAGE_USER }}
      SAGE_PASS: ${{ secrets.SAGE_PASS }}
      SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
      SUPABASE_URL: "https://fbbbsvkshajollduapaw.supabase.co"
      SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiYmJzdmtzaGFqb2xsZHVhcGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwODYyODgsImV4cCI6MjEwMzY2MjI4OH0.8heeqe-03Mji2NgHt17ZOCoctijRhF78cHvSQkrUUi0"
      SAGE_COMPANY_ID: "364261"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install httpx
      - name: Secrets present?
        if: env.SAGE_API_KEY == '' || env.SUPABASE_INGEST_TOKEN == ''
        run: echo "::warning::Sage secrets are not set yet. Add SAGE_API_KEY, SAGE_USER, SAGE_PASS and SUPABASE_INGEST_TOKEN in Settings -> Secrets and variables -> Actions, then re-run."
      - name: Mark running
        if: env.SAGE_API_KEY != '' && env.SUPABASE_INGEST_TOKEN != ''
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/deb_ci_status" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d "{\"p_token\":\"$SUPABASE_INGEST_TOKEN\",\"p_status\":\"running\",\"p_result\":\"Fetching on GitHub Actions\"}" || true
      - name: Fetch from Sage and load the dashboard
        if: env.SAGE_API_KEY != '' && env.SUPABASE_INGEST_TOKEN != ''
        run: python cttlfa_api_fetch.py --push
      - name: Mark done
        if: success() && env.SAGE_API_KEY != '' && env.SUPABASE_INGEST_TOKEN != ''
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/deb_ci_status" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d "{\"p_token\":\"$SUPABASE_INGEST_TOKEN\",\"p_status\":\"done\",\"p_result\":\"Fetched via GitHub Actions\"}" || true
      - name: Mark failed
        if: failure() && env.SAGE_API_KEY != '' && env.SUPABASE_INGEST_TOKEN != ''
        run: |
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/deb_ci_status" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d "{\"p_token\":\"$SUPABASE_INGEST_TOKEN\",\"p_status\":\"error\",\"p_result\":\"GitHub Actions fetch failed - see the run log\"}" || true

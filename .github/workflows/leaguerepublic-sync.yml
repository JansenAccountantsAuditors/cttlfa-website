name: LeagueRepublic sync

# Builds season.json DIRECTLY from the LeagueRepublic JSON Data API (Gold
# feature, leagueID 895893986) — no scraping, no HTML parsing, stdlib only.
# The public website reads the API live in the browser and no longer needs this
# file; season.json now exists only to feed the weekly bulletin and the season
# precheck, so this keeps their data current with no scraping anywhere.

on:
  schedule:
    - cron: "0 * * * *"          # hourly (UTC); only commits when the data changes
  workflow_dispatch: {}          # run on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: lr-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the current season from the API
        run: python3 lr_sync.py --out season.json

      - name: Commit if changed
        run: |
          git config user.name  "cttlfa-sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add season.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update season.json from the LeagueRepublic API ($(date -u +%FT%TZ))"
            git push
          fi
